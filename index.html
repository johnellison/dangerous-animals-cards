<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffd700">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icons/icon-192.svg">
  <title>Wild Animal Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <a href="landing.html" class="home-link" aria-label="Back to home">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <h1 class="logo">Wild Animal Cards</h1>
        <a href="#" class="deck-switch-link" id="deck-switch" aria-label="Switch deck"></a>
        <button class="audio-toggle" id="audio-toggle" aria-label="Toggle audio">
          <svg class="audio-icon audio-on" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg class="audio-icon audio-off" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4l-1.88 1.88L12 7.76V4z"/>
          </svg>
        </button>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-mode="discover">Discover</button>
        <button class="nav-btn" data-mode="guess">Guess</button>
        <button class="nav-btn" data-mode="collection">Collection</button>
      </nav>
    </header>

    <!-- Main Content Area -->
    <main class="main">
      <!-- Discovery Mode -->
      <section class="mode discover-mode active" id="discover-mode">
        <div class="card-carousel">
          <button class="carousel-btn prev" aria-label="Previous card">
            <span>&lt;</span>
          </button>
          <div class="card-stage">
            <div class="card" id="main-card">
              <div class="card-inner">
                <div class="card-front">
                  <div class="card-photo-frame">
                    <div class="card-rarity-glow"></div>
                    <div class="card-image-wrapper">
                      <img class="card-photo" src="" alt="">
                    </div>
                    <div class="card-hint">
                      <span>Who am I?</span>
                      <span class="tap-hint">Tap to reveal!</span>
                    </div>
                  </div>
                </div>
                <div class="card-back">
                  <div class="card-info-frame">
                    <div class="card-rarity-badge"></div>
                    <div class="card-type-icon"></div>
                    <div class="card-name-section">
                      <h2 class="card-name"></h2>
                      <p class="card-epithet"></p>
                    </div>
                    <div class="card-stats">
                      <div class="stat">
                        <span class="stat-label">DANGER</span>
                        <div class="stat-bar"><div class="stat-fill danger"></div></div>
                        <span class="stat-value"></span>
                      </div>
                      <div class="stat">
                        <span class="stat-label">SPEED</span>
                        <div class="stat-bar"><div class="stat-fill speed"></div></div>
                        <span class="stat-value"></span>
                      </div>
                      <div class="stat">
                        <span class="stat-label">SIZE</span>
                        <div class="stat-bar"><div class="stat-fill size"></div></div>
                        <span class="stat-value"></span>
                      </div>
                    </div>
                    <div class="card-facts">
                      <h3 class="facts-title">Fun Facts</h3>
                      <ul class="facts-list">
                        <li class="fact-item"></li>
                        <li class="fact-item"></li>
                        <li class="fact-item"></li>
                      </ul>
                    </div>
                    <div class="card-footer">
                      <span class="card-habitat"></span>
                      <span class="card-region"></span>
                    </div>
                    <button class="audio-replay-btn" aria-label="Replay audio" title="Replay audio">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <button class="carousel-btn next" aria-label="Next card">
            <span>&gt;</span>
          </button>
        </div>
        <div class="card-counter">
          <span class="current">1</span> / <span class="total">0</span>
        </div>
      </section>

      <!-- Guess Mode -->
      <section class="mode guess-mode" id="guess-mode">
        <div class="guess-card-stage">
          <div class="card guess-card" id="guess-card">
            <div class="card-inner">
              <div class="card-front">
                <div class="card-photo-frame silhouette-mode">
                  <div class="card-image-wrapper">
                    <img class="card-photo silhouette-image" src="" alt="Mystery Animal">
                  </div>
                  <p class="guess-prompt">Who am I?</p>
                </div>
              </div>
              <div class="card-back">
                <div class="card-info-frame">
                  <div class="card-rarity-badge"></div>
                  <div class="card-type-icon"></div>
                  <div class="card-name-section">
                    <h2 class="card-name"></h2>
                    <p class="card-epithet"></p>
                  </div>
                  <div class="card-stats">
                    <div class="stat">
                      <span class="stat-label">DANGER</span>
                      <div class="stat-bar"><div class="stat-fill danger"></div></div>
                      <span class="stat-value"></span>
                    </div>
                    <div class="stat">
                      <span class="stat-label">SPEED</span>
                      <div class="stat-bar"><div class="stat-fill speed"></div></div>
                      <span class="stat-value"></span>
                    </div>
                    <div class="stat">
                      <span class="stat-label">SIZE</span>
                      <div class="stat-bar"><div class="stat-fill size"></div></div>
                      <span class="stat-value"></span>
                    </div>
                  </div>
                  <div class="card-facts">
                    <h3 class="facts-title">Fun Facts</h3>
                    <ul class="facts-list">
                      <li class="fact-item"></li>
                      <li class="fact-item"></li>
                      <li class="fact-item"></li>
                    </ul>
                  </div>
                  <div class="card-footer">
                    <span class="card-habitat"></span>
                    <span class="card-region"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="guess-options" id="guess-options">
          <!-- Options populated by JS -->
        </div>
        <div class="guess-result" id="guess-result">
          <span class="result-icon"></span>
          <span class="result-text"></span>
        </div>
        <div class="guess-score">
          <span class="score-label">Score:</span>
          <span class="score-value" id="score-value">0</span>
          <span class="streak-label">Streak:</span>
          <span class="streak-value" id="streak-value">0</span>
        </div>
        <button class="next-guess-btn" id="next-guess-btn">Next Animal</button>
      </section>

      <!-- Collection Mode -->
      <section class="mode collection-mode" id="collection-mode">
        <div class="collection-header">
          <h2>My Collection</h2>
          <div class="collection-progress">
            <div class="progress-bar">
              <div class="progress-fill" id="collection-progress"></div>
            </div>
            <span class="progress-text" id="collection-text">0 / 0</span>
          </div>
        </div>

        <!-- Collection Category Tabs -->
        <div class="collection-tabs" id="collection-tabs">
          <button class="collection-tab active" data-collection="all">
            <span class="tab-icon">🌍</span>
            <span class="tab-name">All</span>
          </button>
          <!-- Dynamically populated by JS -->
        </div>

        <div class="collection-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="discovered">Discovered</button>
          <button class="filter-btn" data-filter="undiscovered">Undiscovered</button>
          <button class="filter-btn" data-filter="due">Due for Review</button>
          <button class="filter-btn" data-filter="mastered">Mastered</button>
        </div>
        <div class="collection-search">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" class="search-input" id="collection-search" placeholder="Search animals..." autocomplete="off">
        </div>
        <div class="sr-stats" id="sr-stats">
          <!-- Populated by JS -->
        </div>
        <div class="collection-grid" id="collection-grid">
          <!-- Collection cards populated by JS -->
        </div>
      </section>
    </main>

    <!-- Card Detail Modal -->
    <div class="modal" id="card-modal">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <button class="modal-close" aria-label="Close">&times;</button>
        <div class="modal-card">
          <!-- Full card detail view -->
        </div>
      </div>
    </div>

    <!-- Sound effects are synthesized via Web Audio API in cards.js -->
  </div>

  <script src="js/data.js"></script>
  <script src="js/spaced-repetition.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
