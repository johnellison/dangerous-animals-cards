  <rect width="192" height="192" rx="32" fill="#0a0a1a"/>
  <!-- Subtle paw pad behind claw marks -->
  <ellipse cx="96" cy="120" rx="36" ry="28" fill="#ffd700" opacity="0.12"/>
  <ellipse cx="62" cy="88" rx="12" ry="10" fill="#ffd700" opacity="0.10"/>
  <ellipse cx="130" cy="88" rx="12" ry="10" fill="#ffd700" opacity="0.10"/>
  <ellipse cx="76" cy="72" rx="10" ry="8" fill="#ffd700" opacity="0.08"/>
  <ellipse cx="116" cy="72" rx="10" ry="8" fill="#ffd700" opacity="0.08"/>
  <!-- Three diagonal gold claw scratch marks -->
  <g stroke="#ffd700" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M56 40 L40 152"/>
